name: Security audit

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml"]
  pull_request:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # cargo-audit
        with:
          tool: cargo-audit
      - name: Run audit
        run: cargo audit
