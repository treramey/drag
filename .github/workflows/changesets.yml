name: Changesets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changesets-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        with:
          version: pnpm run version-sync
          publish: pnpm run tag-release
          commit: "chore: release versions"
          title: "chore: release versions"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
