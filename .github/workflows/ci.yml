name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  skills:
    name: Agent Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify repository-controlled skills
        run: |
          cargo run --locked -- generate-skills --scope local --force
          git diff --exit-code -- \
            skills/drag \
            skills/drag-log \
            skills/drag-list \
            skills/drag-delete \
            skills/recipe-log-coding-session \
            skills/recipe-audit-day \
            skills/recipe-audit-week \
            skills/recipe-correct-worklog \
            docs/skills.md

      - name: Check the external Tempo catalog
        env:
          DRAG_CACHE_DIR: ${{ runner.temp }}/drag-openapi
        run: |
          error_file="$(mktemp)"
          if cargo run --quiet --locked -- --output json generate-skills --scope tempo --force 2>"$error_file"; then
            if ! git diff --quiet -- skills/drag-tempo; then
              echo "::warning::Tempo's OpenAPI catalog changed; the scheduled synchronization workflow will open a PR."
            fi
          elif jq -e '.error.code == "openapi_document_error"' <"$error_file" >/dev/null; then
            cat "$error_file" >&2
            echo "::error::Tempo's OpenAPI document was invalid or unsafe; generated files were not replaced."
            exit 1
          else
            cat "$error_file" >&2
            echo "::warning::Tempo's OpenAPI catalog could not be checked; external availability does not block CI."
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate generated skills
        run: |
          failed=0
          for skill_dir in skills/*/; do
            if ! uvx --from skills-ref@0.1.1 agentskills validate "$skill_dir"; then
              failed=1
            fi
          done
          exit "$failed"

  dependencies:
    name: Dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - run: nix flake check

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: mkdir -p dist && pnpm --dir npm pack --pack-destination ../dist
